name: release

on:
    push:
        tags:
            - "v*"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore --configuration Release

            - name: Publish for Windows
              run: dotnet publish --configuration Release --runtime win-x64 --self-contained false --output ./publish/win-x64

            - name: Publish for Linux
              run: dotnet publish --configuration Release --runtime linux-x64 --self-contained false --output ./publish/linux-x64

            - name: Create archives
              run: |
                  cd ./publish
                  zip -r ../Railway-Windows-x64.zip ./win-x64
                  zip -r ../Railway-Linux-x64.zip ./linux-x64
                  cd ..

            - name: Get tag
              id: get_tag
              run: |
                  TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
                  echo "TAG=$TAG" >> $GITHUB_OUTPUT
                  echo "Found tag: $TAG"

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      ./Railway-Windows-x64.zip
                      ./Railway-Linux-x64.zip
                  tag_name: ${{ steps.get_tag.outputs.TAG }}
                  name: Release ${{ steps.get_tag.outputs.TAG }}
                  draft: false
                  prerelease: false
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
