name: release

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore --configuration Release

            - name: Publish for Windows
              run: dotnet publish --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=true --output ./publish/win-x64

            - name: Publish for Linux
              run: dotnet publish --configuration Release --runtime linux-x64 --self-contained true -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=true --output ./publish/linux-x64

            - name: Create archives
              run: |
                  cd ./publish
                  zip -r ../Railway-Windows-x64.zip ./win-x64
                  zip -r ../Railway-Linux-x64.zip ./linux-x64
                  cd ..

            - name: Get latest tag
              id: get_tag
              run: |
                  TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
                  echo "TAG=$TAG" >> $GITHUB_OUTPUT
                  echo "Found tag: $TAG"

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  files: ./publish/**
                  tag_name: v${{ github.run_number }}
                  name: Release v${{ github.run_number }}
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
